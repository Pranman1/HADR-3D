# paper_parity -- deliberately dumbed down to match the GHTC 2025 paper.
#
# This scenario exists to answer ONE question: does our rebuild reproduce the
# published Table I?  So every setting here reproduces the paper's *assumptions*,
# not our better ones.  Where we deliberately cripple ourselves, the line says so.
#
# It is written before any simulator code on purpose.  Everything else gets built
# against this file and hadrsim/core/spec.py.

name: paper_parity
spec_version: 1
seed: 0

# --------------------------------------------------------------------------- clock
# The paper welds every clock together: one step = 5 drone sub-moves = 3 person
# sub-moves = 1 fire tick, capped at 100 steps.  Continuous time forces real units.
# Consequence: "one step" no longer means the same thing.  See doc section 12.
clock:
  physics_hz: 100.0
  control_hz: 2.0            # how often the policy decides
  episode_seconds: 120.0

# --------------------------------------------------------------------------- world
world:
  terrain:
    source: maps/rust25.yaml # the paper's map, reused verbatim
    cell_size_m: 1.0         # 25x25 cells -> a 25 m x 25 m block
    building_height_m: 8.0   # the 2D map has no heights; pick one and state it

  fire:
    model: ca                # cell-to-cell spread, but WITH fuel and burnout
    ignition_points:         # the paper's four fire origins
      - [5, 18]
      - [19, 18]
      - [5, 6]
      - [19, 6]
    n_active: 1              # one of the four per episode
    spread_prob: 0.01        # the paper's tuned value, kept for parity
    fuel_load: 1.0
    burnout_seconds: 60.0    # NEW: the paper's fire never goes out
    blocked_by_buildings: true   # NEW: the paper's fire spreads through walls

  smoke:
    model: none              # CRIPPLED FOR PARITY. The paper has no smoke at all.

  wind:
    model: none              # CRIPPLED FOR PARITY. No wind in the paper.

# -------------------------------------------------------------------------- agents
agents:
  hlr:                       # high-level rescuer: sees wide, cannot intercept
    dynamics: kinematic      # CRIPPLED FOR PARITY. Paper drones teleport between cells.
    airframe: x500_v2        # parameters loaded but unused at kinematic fidelity
    start: [12, 12, 12.0]    # x, y, altitude in metres
    max_speed_mps: 2.0       # 2 cells per step at 2 Hz == the paper's move rate
    can_capture: false
    camera:
      kind: downward
      fov_deg: 90.0          # at 12 m altitude this subtends ~9 m, the paper's 9x9

  llr:                       # low-level rescuer: sees narrow, the only one that can reach
    dynamics: kinematic
    airframe: x500_v2
    start: [13, 11, 3.0]
    max_speed_mps: 2.0
    can_capture: true
    capture_radius_m: 1.5
    camera:
      kind: forward
      fov_deg: 60.0          # ~5 m across at range, the paper's 5x5
      range_m: 5.0

  human:
    panic:
      model: trivedi_rao
      gamma: 0.7             # CRIPPLED FOR PARITY. Paper holds panic fixed;
      gamma_dynamic: false   #   ours normally drives it from fire and smoke.
    motion:
      model: constant_speed  # CRIPPLED FOR PARITY. Social force is off.
      v_max_mps: 1.0
    follows_rescuer:
      model: ideal_astar     # CRIPPLED FOR PARITY. Paper assumes perfect following.
    start_end_pairs: from_map:rust25_40od   # the paper's 40 origin-destination pairs

# ------------------------------------------------------------------------- sensing
sensing:
  detector: oracle           # CRIPPLED FOR PARITY. Exact pose when in view, no noise.
  occlusion:
    buildings_block_llr: true
    buildings_block_hlr: false   # matches see_inside_hlp() in the paper's code
    smoke_blocks: false          # no smoke in this scenario anyway

# --------------------------------------------------------------------------- comms
comms:
  channel: ideal             # CRIPPLED FOR PARITY. Paper assumes perfect comms.

# -------------------------------------------------------------------------- policy
policy:
  n_networks: 1              # one network flying both drones, as in the paper
  encoder: mlp               # CNN comes at step 4; the raster is fed but not convolved
  recurrent: lstm

# -------------------------------------------------------------------------- reward
# Weights carried over from the paper's SpeedScaled reward. l7 is the HLR<->LLR
# coordination term the paper's title rests on -- port it, never reinvent it.
reward:
  capture:              {w: 100.0}
  evacuee_in_hlr_fov:   {w: 1.0}     # paper's l0
  evacuee_in_llr_fov:   {w: 1.0}     # paper's l1
  proximity:            {w: 1.0}     # paper's l2
  goal_progress:        {w: 10.0}    # paper's l3
  role_coordination:    {w: 1.0}     # paper's l7
  fire_proximity:       {w: -1.0}
  control_effort:       {w: -0.01}

# --------------------------------------------------------------------- termination
termination:
  on_capture: true
  on_human_reaches_exit: true
  on_human_burned: true
  on_timeout: true

# --------------------------------------------------------------------- evaluation
# The four metrics from the paper's Table I, and the four perturbation settings.
# od_radius / fire_radius are how far start/end/fire may be randomised, in cells.
evaluation:
  runs_per_env: 100
  metrics: [capture_rate, time_to_capture, time_to_first_seen, time_in_fov]
  environments:
    env_I:   {od_radius: 0, fire_radius: 0}   # paper: 71.0  13.20  8.48  30.77
    env_II:  {od_radius: 5, fire_radius: 0}   # paper: 61.0  12.28  7.46  31.60
    env_III: {od_radius: 0, fire_radius: 5}   # paper: 68.0  10.91  6.75  33.77
    env_IV:  {od_radius: 5, fire_radius: 5}   # paper: 66.0  12.83  8.77  32.79
