# The shipped balance, by what each term is *worth over an episode*, not by how the
# numbers read side by side: coverage pays a little every step, proximity only once
# somebody is in sight, so equal-looking weights are nothing like equal.
# A negative weight makes a term a penalty; every term itself returns a magnitude.

# with a counterpart in the paper (reward/paper.py)
capture: 200.0               # l3
evacuee_in_hlr_fov: 1.0      # l0
evacuee_in_llr_fov: 2.0      # l1
proximity: 20.0              # l2
role_coordination: 1.0       # l7
time_penalty: -0.02          # l6
fire_proximity: -1.0

# ours, for a city block (reward/ours.py)
reached_safety: 100.0
goal_progress: 10.0
search_coverage: 0.5
first_sight: 20.0
coverage: 10.0
apparent_size: 5.0
evacuee_harmed: -100.0
control_effort: -0.01
